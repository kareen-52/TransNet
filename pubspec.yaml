name: graduation_progect
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.4
  google_fonts: ^8.0.0
  flutter_localization: ^0.3.3
  flutter_secure_storage: ^10.0.0


  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  equatable: ^2.0.8

  device_preview: ^1.3.1
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  json_serializable: ^6.13.0
  json_annotation: ^4.11.0
  dio: ^5.9.1
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.3
  pretty_dio_logger: ^1.4.0
  responsive_builder: ^0.7.1
  flutter_native_splash: ^2.4.7
  pinput: ^6.0.2
  flutter_localizations:
    sdk: flutter
  curved_labeled_navigation_bar: ^2.0.6
  flutter_map: ^8.2.2
  location: ^8.0.1
  latlong2: ^0.9.1
  shimmer: ^3.0.0
  lottie: ^3.3.3
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.1
  # share_plus: ^7.2.2
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.11.1    
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"


flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/logo.png
  color_dark: "#000000"
  image_dark: assets/icons/logo.png
  android_12:
    image: assets/icons/logo_android12.png
    color: "#FFFFFF"
    # icon_background_color: "#00000000"
    image_dark: assets/icons/logo_android12.png
    color_dark: "#000000"
    # icon_background_color_dark: "#00000000"
    
  android: true
  ios: true
  ios_content_mode: center
  fullscreen: true
  web: false


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/